name: Smart Lua Real BRPlayerCharacterBase Acceptance

on:
  push:
    branches: [feat/smart-lua-recovery-fusion-20261109]
    paths:
      - .github/workflows/smart-lua-real-sample-acceptance.yml
      - app/src/main/python/lua_engine/**
      - app/src/main/python/lua_intelligence/**
      - tests/test_lua*.py
  pull_request:
    branches: [feat/full-reference-source-registry-20261106]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sample-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ALVSIA PRO source
        uses: actions/checkout@v4

      - name: Install 32-bit build toolchain
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386

      - name: Build LuaDec 5.3 as 32-bit reference engine
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/zhangjiequan/luadec.git luadec-src
          make -C luadec-src/lua-5.3/src liblua.a lua CC="gcc -m32" CFLAGS="-m32" SYSLIBS="-lm -ldl"
          printf "#define SRCVERSION \"ci-20261110\"\\n" > luadec-src/luadec/srcversion.h
          make -C luadec-src/luadec LUAVER=5.3 CC="gcc -m32" CFLAGS="-m32 -I../lua-5.3/src" LDFLAGS="-m32"
          test -x luadec-src/luadec/luadec
          file luadec-src/luadec/luadec
          luadec-src/luadec/luadec >/dev/null || true

      - name: Checkout authorized BRPlayerCharacterBase sample
        uses: actions/checkout@v4
        with:
          repository: papaalvisia-creator/kumpulan-source-tool
          ref: sample/brplayercharacterbase-20261109-175719
          token: ${{ secrets.SMART_LUA_SAMPLE_TOKEN }}
          path: authorized-sample
          fetch-depth: 1

      - name: Verify exact authorized sample
        env:
          EXPECTED_SHA256: a99539e2a78bd4e11febb919735fbd9f43a94aa3a0ddc7b6efc610854b10433a
          EXPECTED_SIZE: "5583230"
        run: |
          set -euo pipefail
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          test -f "$SAMPLE"
          test "$(stat -c %s "$SAMPLE")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $SAMPLE" | sha256sum -c -
          echo "AUTHORIZED SAMPLE: PASS"
          xxd -l 32 "$SAMPLE"

      - name: Preflight and enumerate functions
        run: |
          set -euo pipefail
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          luadec-src/luadec/luadec -pn "$SAMPLE" > functions.txt
          grep -Eq '^[[:space:]]*[0-9]+(_[0-9]+)*$' functions.txt
          cat functions.txt
          COUNT=$(grep -Ec '^[[:space:]]*[0-9]+(_[0-9]+)*$' functions.txt)
          test "$COUNT" -gt 0
          echo "FUNCTION_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Full instruction-level compiler differential
        run: |
          set -euo pipefail
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          mkdir -p acceptance
          set +e
          timeout 1800s luadec-src/luadec/luadec -fc "$SAMPLE" > acceptance/full-fc.txt 2>&1
          RC=$?
          set -e
          cat acceptance/full-fc.txt
          test "$RC" -eq 0
          if grep -q "function check fail" acceptance/full-fc.txt; then
            echo "REAL SAMPLE ACCEPTANCE FAILED: LuaDec reported function-check failures"
            grep "function check fail" acceptance/full-fc.txt
            exit 1
          fi
          PASS_COUNT=$(grep -Ec "function check pass" acceptance/full-fc.txt || true)
          test "$PASS_COUNT" -gt 0
          echo "FULL DIFFERENTIAL PASS: $PASS_COUNT functions"

      - name: ALVSIA source validation on full recovered output
        run: |
          set -euo pipefail
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          luadec-src/luadec/luadec "$SAMPLE" > acceptance/BRPlayerCharacterBase.lua
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "app/src/main/python")
          from lua_engine.engine import validate_lua_source
          p=Path("acceptance/BRPlayerCharacterBase.lua")
          ok,note=validate_lua_source(p, expected_version="Lua 5.3")
          print(f"source_validation={ok} {note}")
          if not ok:
              raise SystemExit(1)
          print("REAL SAMPLE SOURCE VALIDATION: PASS")
          PY

      - name: Upload real acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: smart-lua-real-brplayer-acceptance
          path: acceptance
          if-no-files-found: error

      - name: Final gate
        run: |
          echo "REAL SAMPLE ACCEPTANCE: PASS"
          echo "BRPlayerCharacterBase exact hash verified"
          echo "Function-level instruction differential passed"
          echo "ALVSIA source validation passed"
