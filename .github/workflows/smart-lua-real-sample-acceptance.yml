name: Smart Lua Real BRPlayerCharacterBase Acceptance

on:
  push:
    branches:
      - feat/smart-lua-recovery-fusion-20261109
    paths:
      - .github/workflows/smart-lua-real-sample-acceptance.yml
      - app/src/main/python/lua_engine/**
      - app/src/main/python/lua_intelligence/**
      - tests/test_lua*.py
  pull_request:
    branches:
      - feat/full-reference-source-registry-20261106
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-lua-real-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enumerate:
    name: Enumerate real sample functions
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      groups: ${{ steps.matrix.outputs.groups }}
    steps:
      - name: Checkout ALVSIA PRO source
        uses: actions/checkout@v4

      - name: Install Lua 5.3 and build LuaDec 5.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.3 libreadline-dev
          git clone --depth 1 --recurse-submodules https://github.com/zhangjiequan/luadec.git luadec-src
          python - <<'PY'
          from pathlib import Path
          p=Path("luadec-src/lua-5.3/src/lundump.c")
          s=p.read_text()
          old='''static void fchecksize (LoadState *S, size_t size, const char *tname) {
  if (LoadByte(S) != size)
    error(S, luaO_pushfstring(S->L, "%s size mismatch in", tname));
}'''
          new='''static void fchecksize (LoadState *S, size_t size, const char *tname) {
  int declared = LoadByte(S);
  if (strcmp(tname, "size_t") == 0) {
    if (declared != 4 && declared != (int)size)
      error(S, luaO_pushfstring(S->L, "%s size mismatch in", tname));
    return;
  }
  if (declared != (int)size)
    error(S, luaO_pushfstring(S->L, "%s size mismatch in", tname));
}'''
          if old not in s:
              raise SystemExit("LuaDec lundump fchecksize pattern not found")
          s=s.replace(old,new,1)
          old2='''  size_t size;
  LoadVar(S,size);'''
          new2='''  unsigned int size;
  LoadVar(S,size);'''
          if old2 not in s:
              raise SystemExit("LuaDec LoadString size_t pattern not found")
          s=s.replace(old2,new2,1)
          p.write_text(s)
          print("patched LuaDec for Lua 5.3 32-bit size_t chunks")
          PY
          make -C luadec-src/lua-5.3 linux
          make -C luadec-src/luadec LUAVER=5.3
          test -x luadec-src/luadec/luadec

      - name: Checkout authorized BRPlayerCharacterBase sample
        uses: actions/checkout@v4
        with:
          repository: papaalvisia-creator/kumpulan-source-tool
          ref: sample/brplayercharacterbase-20261109-175719
          token: ${{ secrets.SMART_LUA_SAMPLE_TOKEN }}
          path: authorized-sample
          fetch-depth: 1

      - name: Verify exact authorized sample
        env:
          EXPECTED_SHA256: a99539e2a78bd4e11febb919735fbd9f43a94aa3a0ddc7b6efc610854b10433a
          EXPECTED_SIZE: "5583230"
        run: |
          set -euo pipefail
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          test -f "$SAMPLE"
          test "$(stat -c %s "$SAMPLE")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $SAMPLE" | sha256sum -c -
          echo "AUTHORIZED SAMPLE: PASS"
          xxd -l 32 "$SAMPLE"

      - name: Enumerate every bytecode function
        id: matrix
        run: |
          set -euo pipefail
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          luadec-src/luadec/luadec -pn "$SAMPLE" > functions.txt
          grep -Eq '^[[:space:]]*[0-9]+(_[0-9]+)*$' functions.txt
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          values=[]
          for line in Path("functions.txt").read_text().splitlines():
              s=line.strip()
              if re.fullmatch(r"[0-9]+(?:_[0-9]+)*", s):
                  values.append(s)
          if not values or values[0] != "0":
              raise SystemExit("function enumeration missing root function")
          groups=[values[i:i+8] for i in range(0,len(values),8)]
          if len(groups) > 256:
              raise SystemExit(f"sample has too many function groups for one matrix run: {len(groups)}")
          Path("function_count.txt").write_text(str(len(values)))
          Path("groups.json").write_text(json.dumps(groups,separators=(",",":")))
          print(f"functions={len(values)} groups={len(groups)}")
          PY
          echo "groups=$(cat groups.json)" >> "$GITHUB_OUTPUT"
          cat functions.txt
          cat groups.json

      - name: Upload LuaDec and function manifest
        uses: actions/upload-artifact@v4
        with:
          name: smart-lua-real-sample-luadec
          path: |
            luadec-src/luadec/luadec
            functions.txt
            groups.json
            function_count.txt
          if-no-files-found: error

  validate:
    name: Validate functions ${{ join(matrix.functions, ', ') }}
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        functions: ${{ fromJSON(needs.enumerate.outputs.groups) }}
    steps:
      - name: Checkout ALVSIA PRO source
        uses: actions/checkout@v4

      - name: Download LuaDec manifest
        uses: actions/download-artifact@v5
        with:
          name: smart-lua-real-sample-luadec
          path: tools

      - name: Checkout authorized BRPlayerCharacterBase sample
        uses: actions/checkout@v4
        with:
          repository: papaalvisia-creator/kumpulan-source-tool
          ref: sample/brplayercharacterbase-20261109-175719
          token: ${{ secrets.SMART_LUA_SAMPLE_TOKEN }}
          path: authorized-sample
          fetch-depth: 1

      - name: Verify sample hash before every validation shard
        env:
          EXPECTED_SHA256: a99539e2a78bd4e11febb919735fbd9f43a94aa3a0ddc7b6efc610854b10433a
        run: |
          set -euo pipefail
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          echo "$EXPECTED_SHA256  $SAMPLE" | sha256sum -c -

      - name: Decompile and compiler-differential validate shard
        run: |
          set -euo pipefail
          chmod +x tools/luadec-src/luadec/luadec
          SAMPLE="$GITHUB_WORKSPACE/authorized-sample/samples/lua/BRPlayerCharacterBase.lua"
          mkdir -p shard-output
          FAIL=0

          for FN in ${{ join(matrix.functions, ' ') }}; do
            echo "=== FUNCTION $FN ==="
            OUT="shard-output/function-$FN.lua"
            LOG="shard-output/function-$FN.log"
            if timeout 50s tools/luadec-src/luadec/luadec -fc -f "$FN" -ns "$SAMPLE" > "$OUT" 2> "$LOG"; then
              :
            else
              RC=$?
              echo "function $FN command failed/timeout rc=$RC"
              cat "$LOG" || true
              FAIL=1
              continue
            fi

            if grep -q "function check fail" "$OUT"; then
              echo "function $FN semantic differential FAILED"
              grep "function check" "$OUT" || true
              FAIL=1
            else
              echo "function $FN semantic differential PASS"
            fi

            python - "$OUT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "app/src/main/python")
          from lua_engine.engine import validate_lua_source
          p=Path(sys.argv[1])
          ok,note=validate_lua_source(p, expected_version="Lua 5.3")
          print(f"source_validation={ok} {note}")
          if not ok:
              raise SystemExit(1)
          PY
          done

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

      - name: Upload validated shard
        uses: actions/upload-artifact@v4
        with:
          name: smart-lua-real-sample-shard-${{ strategy.job-index }}
          path: shard-output
          if-no-files-found: error

  final:
    name: Final real sample acceptance
    needs:
      - enumerate
      - validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every function shard to pass
        run: |
          if [ "${{ needs.enumerate.result }}" != "success" ] || [ "${{ needs.validate.result }}" != "success" ]; then
            echo "REAL SAMPLE ACCEPTANCE: FAILED"
            echo "enumerate=${{ needs.enumerate.result }}"
            echo "validate=${{ needs.validate.result }}"
            exit 1
          fi
          echo "REAL SAMPLE ACCEPTANCE: PASS"
          echo "Every enumerated BRPlayerCharacterBase function passed LuaDec -fc compiler differential validation."
