name: ALVSIA SMART PREMIUM Final Release Pipeline

on:
  push:
    branches: [main, feat/alvsia-smart-premium-security-final-20261111, fix/task-output-routing-20261111, feat/combined-smart-lua-xop-release-20261110, feat/lua-intelligence-orchestrator-20261107, feat/alvsia-smart-premium-v1-20261112, fix/engine-repair-20261114, feat/alvsia-capability-expansion-security-20261114-clean]
    paths:
      - '.github/workflows/alvsia-final-release.yml'
      - '.github/workflows/android-validation.yml'
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - 'research/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/alvsia-final-release.yml'
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'research/**'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alvsia-final-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chaquopy build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android NDK and CMake
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
          test -d "$ANDROID_HOME/ndk/27.0.12077973"

      - name: Build native Smart Lua engines
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: |
          set -euo pipefail
          bash tools/build_unluac_rs_android.sh
          bash tools/build_luau_decompiler_android.sh
          test -s app/src/main/jniLibs/arm64-v8a/libunluac-cli.so
          test -s app/src/main/jniLibs/arm64-v8a/libluau-decompiler-cli.so

      - name: Source and Lua validation
        run: |
          set -euo pipefail
          if ! command -v luac5.3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lua5.3
          fi
          command -v luac5.3
          python3 tools/security_release_check.py
          python3 tests/test_release_pipeline_consistency.py
          python3 tests/test_release_apk_audit_policy.py
          python3 -m unittest tests.test_security_wiring tests.test_security_fabric
          python3 -m pip install --disable-pip-version-check pycryptodome pytest && python3 -m pytest -q tests/test_tool_dispatch.py
          python3 -m pytest -q tests/test_sm4_material_isolation.py
          python3 -m pytest -q tests/test_binary_url_scanner.py
          python3 -m pytest -q tests/test_pubg_lua_converter.py
          python3 -m pytest -q tests/test_native_lua_runtime_wiring.py
          python3 -m unittest tests.test_live_workspace_and_file_limits
          python3 -m py_compile app/src/main/python/smart_lua_engine.py app/src/main/python/smart_pak_lua_engine.py app/src/main/python/sm4_secret_registry.py app/src/main/python/smart_archive_engine.py app/src/main/python/smart_data_engine.py app/src/main/python/module_adapters.py app/src/main/python/alvsia_bridge_impl.py
          python3 tests/test_smart_lua_streaming.py
          python3 -m pytest -q tests/test_large_lua_memory_budget.py
          python3 tests/test_smart_archive_engine.py
          python3 -m pytest -q tests/test_smart_pak_lua_pipeline.py
          python3 tests/test_smart_data_engine.py
          python3 -m pip install --disable-pip-version-check zstandard
          python3 -m pytest -q tests/test_pak_extraction_contract.py
          python3 tests/test_lua_engine.py
          python3 -m pytest -q tests/test_lua_orchestrator.py
          python3 tests/test_vm_protect_roundtrip.py

      - name: Reference corpus research status
        run: |
          set -euo pipefail
          echo "Reference corpus is private and is validated by its own ALVSIA Reference Corpus Research workflow."
          echo "Release workflow does not attempt unauthenticated cross-repository access."
          echo "Corpus repository: papaalvisia-creator/kumpulan-source-tool"
          echo "Required research workflow: ALVSIA Reference Corpus Research"
          test -n "papaalvisia-creator/kumpulan-source-tool"

      - name: Prepare sealed release
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography pycryptodome pytest
          SEED=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "::add-mask::$SEED"
          export ALVSIA_SEAL_SEED_HEX="$SEED"
          python3 tools/seal_python.py --seal
          python3 tools/seal_assets.py
          python3 - "$SEED" <<'PY'
          import pathlib, sys
          seed=sys.argv[1]
          p=pathlib.Path("app/src/main/cpp/rasp_guard.cpp")
          s=p.read_text()
          old="static const unsigned char _alvsia_seal_seed[32] = {0};"
          if s.count(old)!=1:
              raise SystemExit("seal seed placeholder missing or ambiguous")
          values=", ".join("0x"+seed[i:i+2] for i in range(0,64,2))
          p.write_text(s.replace(old,"static const unsigned char _alvsia_seal_seed[32] = {"+values+"};"))
          PY

      - name: Build unsigned APK
        env:
          CHAQUOPY_BUILD_PYTHON: python3.8
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          bash tools/run_gradle_with_retry.sh ./gradlew assembleRelease --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -s "$APK"
          mkdir -p validation-artifacts
          cp "$APK" validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0_unsigned.apk
          sha256sum validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0_unsigned.apk

      - name: Sign baseline for XOP
        env:
          ALVSIA_KEYSTORE_BASE64: ${{ secrets.ALVSIA_KEYSTORE_BASE64 }}
          ALVSIA_KEYSTORE_PASSWORD: ${{ secrets.ALVSIA_KEYSTORE_PASSWORD }}
          ALVSIA_KEY_ALIAS: ${{ secrets.ALVSIA_KEY_ALIAS }}
          ALVSIA_KEY_PASSWORD: ${{ secrets.ALVSIA_KEY_PASSWORD }}
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/alvsia-release.jks"
          KSPASS="${ALVSIA_KEYSTORE_PASSWORD:-${CM_KEYSTORE_PASSWORD:-}}"
          ALIAS="${ALVSIA_KEY_ALIAS:-${CM_KEY_ALIAS:-alvsia}}"
          KEYPASS="${ALVSIA_KEY_PASSWORD:-${CM_KEY_PASSWORD:-$KSPASS}}"
          if [ -n "${ALVSIA_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ALVSIA_KEYSTORE_BASE64" | base64 --decode > "$KS"
          elif [ -n "${CM_KEYSTORE:-}" ]; then
            if [ -f "$CM_KEYSTORE" ]; then cp "$CM_KEYSTORE" "$KS"; else printf '%s' "$CM_KEYSTORE" | base64 --decode > "$KS"; fi
          else
            echo "ERROR: no signing keystore secret is available"
            exit 1
          fi
          test -s "$KS"
          test -n "$KSPASS"
          export KSPASS KEYPASS
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:KSPASS --key-pass env:KEYPASS --out "$RUNNER_TEMP/alvsia-xop-input.apk" validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0_unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/alvsia-xop-input.apk"

      - name: Build XopProtector and pack candidate
        run: |
          set -euo pipefail
          XOP="$RUNNER_TEMP/xopprotector-src"
          git clone --filter=blob:none https://github.com/xopJack/XopProtector.git "$XOP"
          git -C "$XOP" checkout --detach 5990c31
          # ALVSIA Chaquopy compatibility: keep assets/chaquopy and runtime license files plaintext.
          # Business payloads (including nx/* sealed JARs) are encrypted by Xop PAS1 and
          # loaded through the injected ProtectorAssets bridge. Chaquopy's app.imy is
          # intentionally excluded because the Chaquopy runtime reads it directly.
          python3 - "$XOP/packer/src/main/java/com/yqsh/protector/packer/AssetsEncryptor.java" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          anchor = '            if (rel.startsWith("dexopt/") || rel.equals("dexopt")) {\n'
          inject = '''            // ALVSIA runtime exclusions: Chaquopy loads app.imy directly; engine notices are audited runtime metadata.\n            if (rel.startsWith("chaquopy/") || rel.startsWith("engine_licenses/")) {\n                skipped++;\n                prog.tick();\n                continue;\n            }\n'''
          if s.count(anchor) != 1:
              raise SystemExit("unexpected Xop AssetsEncryptor layout; refusing blind patch")
          s = s.replace(anchor, inject + anchor, 1)
          p.write_text(s)
          print("PASS: Xop asset encryptor patched for Chaquopy-safe exclusions")
          PY
          rm -f "$XOP/local.properties"
          python3 - "$XOP/settings.gradle.kts" "$XOP/gradle.properties" <<'PY'
          import pathlib, re, sys
          settings = pathlib.Path(sys.argv[1])
          props = pathlib.Path(sys.argv[2])
          ss = settings.read_text()
          lines = ss.splitlines(True)
          filtered = [ln for ln in lines if not re.search(r'E:/Android/|E:\\\\Android\\\\', ln)]
          if len(filtered) == len(lines):
              raise SystemExit("XOP settings Windows SDK candidate not found; upstream layout changed")
          settings.write_text("".join(filtered))
          ps = props.read_text()
          p_lines = ps.splitlines(True)
          p_filtered = [ln for ln in p_lines if not ln.lstrip().startswith("unimp.sdk.libs=")]
          if len(p_filtered) == len(p_lines):
              raise SystemExit("XOP unimp.sdk.libs property not found; upstream layout changed")
          props.write_text("".join(p_filtered))
          PY
          python3 - "$XOP/native/build.gradle.kts" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          if "ndkVersion" in s: raise SystemExit("unexpected Xop native Gradle layout")
          marker="android {"
          if s.count(marker)!=1: raise SystemExit("unexpected Xop native Gradle layout")
          p.write_text(s.replace(marker, marker+'\n    ndkVersion = "27.0.12077973"',1))
          PY
          chmod +x "$XOP/gradlew"
          (cd "$XOP" && bash "$GITHUB_WORKSPACE/tools/run_gradle_with_retry.sh" ./gradlew --no-daemon :packer:jar exportShellFiles)
          PACKER=$(find "$XOP/packer/build/libs" -maxdepth 1 -type f -name 'protector-packer-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -s "$PACKER"
          # Xop PAS1 asset encryption is enabled; Chaquopy app.imy and engine licenses are excluded by the patched packer.
          java -jar "$PACKER" "$RUNNER_TEMP/alvsia-xop-input.apk" -o "$RUNNER_TEMP/alvsia-xop-candidate.apk" --shell-dir "$XOP/executable/shell-files" --profile industry --protect-so --encrypt-assets --detect-proxy --so-decrypt-mode lazy
          test -s "$RUNNER_TEMP/alvsia-xop-candidate.apk"
          python3 tools/prepare_xop_final.py "$RUNNER_TEMP/alvsia-xop-input.apk" "$RUNNER_TEMP/alvsia-xop-candidate.apk"

      - name: Sign final XOP APK and verify
        env:
          ALVSIA_KEYSTORE_BASE64: ${{ secrets.ALVSIA_KEYSTORE_BASE64 }}
          ALVSIA_KEYSTORE_PASSWORD: ${{ secrets.ALVSIA_KEYSTORE_PASSWORD }}
          ALVSIA_KEY_ALIAS: ${{ secrets.ALVSIA_KEY_ALIAS }}
          ALVSIA_KEY_PASSWORD: ${{ secrets.ALVSIA_KEY_PASSWORD }}
          CM_KEYSTORE: ${{ secrets.CM_KEYSTORE }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/alvsia-release.jks"
          KSPASS="${ALVSIA_KEYSTORE_PASSWORD:-${CM_KEYSTORE_PASSWORD:-}}"
          ALIAS="${ALVSIA_KEY_ALIAS:-${CM_KEY_ALIAS:-alvsia}}"
          KEYPASS="${ALVSIA_KEY_PASSWORD:-${CM_KEY_PASSWORD:-$KSPASS}}"
          if [ -n "${ALVSIA_KEYSTORE_BASE64:-}" ]; then printf '%s' "$ALVSIA_KEYSTORE_BASE64" | base64 --decode > "$KS"
          elif [ -n "${CM_KEYSTORE:-}" ]; then if [ -f "$CM_KEYSTORE" ]; then cp "$CM_KEYSTORE" "$KS"; else printf '%s' "$CM_KEYSTORE" | base64 --decode > "$KS"; fi
          else echo "ERROR: no signing keystore secret is available"; exit 1; fi
          export KSPASS KEYPASS
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -p 4 "$RUNNER_TEMP/xopprotector.apk" "$RUNNER_TEMP/alvsia-xop-aligned.apk" 2>/dev/null || true
          INPUT="$RUNNER_TEMP/alvsia-xop-candidate.apk"
          if [ ! -s "$INPUT" ]; then INPUT="$RUNNER_TEMP/xopprotector.apk"; fi
          test -s "$INPUT"
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:KSPASS --key-pass env:KEYPASS --out validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-xop-signed.apk "$INPUT"
          "$APKSIGNER" verify --verbose --print-certs validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-xop-signed.apk
          python3 tools/audit_release_apk.py validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-xop-signed.apk
          sha256sum validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-xop-signed.apk

      - name: Create clean source snapshot and verify export hygiene
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_ZIP="validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-source-${SOURCE_COMMIT}.zip"
          mkdir -p validation-artifacts "$RUNNER_TEMP/alvsia-source-audit"
          git archive --format=zip --prefix=ALVSIA_SMART_PREMIUM_6.0.0/ "$SOURCE_COMMIT" > "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/alvsia-source-audit"
          python3 "$RUNNER_TEMP/alvsia-source-audit/ALVSIA_SMART_PREMIUM_6.0.0/tools/security_release_check.py"
          python3 - "$SOURCE_COMMIT" "$SOURCE_ZIP" <<'PY'
          import hashlib, json, pathlib, sys
          commit, archive = sys.argv[1], pathlib.Path(sys.argv[2])
          manifest = {
              "product": "ALVSIA SMART PREMIUM 6.0.0",
              "source_commit": commit,
              "archive": archive.name,
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "format": "git archive ZIP",
              "git_metadata_included": False,
              "untracked_files_included": False,
              "export_hygiene_check": "PASS",
          }
          archive.with_suffix(".manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload clean source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ALVSIA_SMART_PREMIUM_6.0.0-source-snapshot
          path: |
            validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-source-*.zip
            validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-source-*.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload final APK and audit
        uses: actions/upload-artifact@v4
        with:
          name: ALVSIA_SMART_PREMIUM_6.0.0-final-xop-signed
          path: |
            validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0_unsigned.apk
            validation-artifacts/ALVSIA_SMART_PREMIUM_6.0.0-xop-signed.apk
            release_security_audit.txt
          if-no-files-found: error

# release pipeline trigger checkpoint
# final-build-trigger-20261112-lua53-source
