name: Android Security Validation
on:
  push:
    branches: [ main, fix/chaquopy-python312-ci, fix/lua-normalization-fallback-20261103, release/5.5.2-19-module-redesign ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chaquopy 15 host-side pip imports cgi, removed in Python 3.13+.
      # Pin the CI host interpreter; embedded app Python remains set in app/build.gradle.kts.
      - name: Set up compatible host Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify host Python version
        run: python3 --version

      - name: Generate fresh per-build seal seed
        run: |
          SEED=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          echo "::add-mask::$SEED"
          echo "ALVSIA_SEAL_SEED_HEX=$SEED" >> "$GITHUB_ENV"
          echo "Seal seed generated (32 bytes); value is masked."

      - name: Run source-level security checks
        run: python3 tools/security_release_check.py

      - name: Verify security protections are wired into runtime
        run: python3 -m unittest tests.test_security_wiring

      - name: Verify active Unaux Python TLS pin policy
        run: python3 -m unittest discover -s tests -p 'test_pinned_http.py'

      - name: Compile Python tool modules and run dispatch contract tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          modules = (
              "app/src/main/python/alvsia_bridge.py",
              "app/src/main/python/alvsia_bridge_impl.py",
              "app/src/main/python/alvsia_metadata.py",
              "app/src/main/python/alvsia_core.py",
              "app/src/main/python/alvsia_features.py",
              "app/src/main/python/alvsia_ultimate.py",
              "app/src/main/python/alvsia_vm_protect.py",
              "app/src/main/python/archive_engine.py",
              "app/src/main/python/alvsia_private.py",
              "app/src/main/python/sealed_loader.py",
          )
          for name in modules:
              compile(Path(name).read_text(encoding="utf-8"), name, "exec")
          print("PYTHON SYNTAX CHECK: PASS")
          PY
          python3 tests/test_tool_dispatch.py
          python3 tests/test_archive_engine.py
          python3 tests/test_studio_catalog.py
          python3 tests/test_process_page.py
          python3 tests/test_workspace_handoff.py
          python3 -m unittest tests.test_private_tool_engine
          python3 -m unittest discover -s tests -p 'test_metadata_v39.py'
          python3 -m unittest discover -s tests -p 'test_foreign_branding.py'

      - name: Verify Telegram notifier integration contract
        run: |
          python3 -m unittest tests.test_telegram_notifier_contract
          python3 -m unittest tests.test_threat_report_contract

      - name: Run sealed payload cryptographic tests
        run: |
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tests/test_seal_python_payloads.py

      - name: Run Lua decompiler safety regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pycryptodome pytest
          python3 -m unittest discover -s tests -p 'test_reference_source_parity.py'
          python3 -m unittest discover -s tests -p 'test_so_patch_url_parity.py'
          python3 tests/test_lua_engine.py
          python3 -m pytest -q tests/test_lua_orchestrator.py
          python3 -m unittest discover -s tests -p 'test_lua*.py'
          python3 -m unittest discover -s tests -p 'test_streaming_decompiler.py'

      - name: Run Lua Protector round-trip tests
        run: python3 tests/test_vm_protect_roundtrip.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust stable and Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install pinned Android NDK and CMake
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
          test -d "$ANDROID_HOME/ndk/27.0.12077973"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Build pinned native Smart Lua engines
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: |
          set -euo pipefail
          bash tools/build_unluac_rs_android.sh
          bash tools/build_luau_decompiler_android.sh
          test -s app/src/main/jniLibs/arm64-v8a/libunluac-cli.so
          test -s app/src/main/jniLibs/arm64-v8a/libluau-decompiler-cli.so
          test -s app/src/main/assets/engine_licenses/unluac-rs-MIT.txt
          test -s app/src/main/assets/engine_licenses/luau-decompiler-MIT.txt

      - name: Build and test Android debug variant
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare sealed release inputs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cryptography
          python3 tools/seal_python.py --seal
          python3 tools/seal_assets.py
          test ! -e app/src/main/assets/unluac/unluac.jar

      - name: Inject per-build seed into native library source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          seed = os.environ.get("ALVSIA_SEAL_SEED_HEX", "")
          if len(seed) != 64 or any(c not in "0123456789abcdefABCDEF" for c in seed):
              raise SystemExit("Invalid per-build seal seed")
          path = Path("app/src/main/cpp/rasp_guard.cpp")
          source = path.read_text()
          old = "static const unsigned char _alvsia_seal_seed[32] = {0};"
          values = ", ".join("0x" + seed[i:i+2] for i in range(0, 64, 2))
          if source.count(old) != 1:
              raise SystemExit("Native seed placeholder missing or ambiguous")
          path.write_text(source.replace(old, "static const unsigned char _alvsia_seal_seed[32] = {" + values + "};"))
          PY

      - name: Build release APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          # Strip non-runtime metadata and the plaintext rebrand template before auditing.
          python3 tools/strip_vcs_metadata.py "$APK"
          python3 tools/audit_release_apk.py "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT" || { echo "FAIL: aapt not found"; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.alvsia.pro' versionCode='98' versionName='5.5.2-hardened'" || {
            echo "FAIL: APK package/version does not match release source"
            printf '%s\n' "$BADGING" | grep -E "^package:|^application-label:" || true
            exit 1
          }
          echo "PASS: APK package/version verified"
          mkdir -p validation-artifacts
          cp "$APK" validation-artifacts/ALVISIA_PRO_5.5.2-hardened_release_unsigned.apk
          cp release_security_audit.txt validation-artifacts/
          sha256sum validation-artifacts/*.apk

      - name: Sign internal baseline for XopProtector input
        env:
          ALVSIA_KEYSTORE_BASE64: ${{ secrets.ALVSIA_KEYSTORE_BASE64 }}
          ALVSIA_KEYSTORE_PASSWORD: ${{ secrets.ALVSIA_KEYSTORE_PASSWORD }}
          ALVSIA_KEY_ALIAS: ${{ secrets.ALVSIA_KEY_ALIAS }}
          ALVSIA_KEY_PASSWORD: ${{ secrets.ALVSIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ALVSIA_KEYSTORE_BASE64 ALVSIA_KEYSTORE_PASSWORD ALVSIA_KEY_ALIAS ALVSIA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Actions secret $name is not configured; cannot create a signed XopProtector input."
              exit 1
            fi
          done
          BASE_UNSIGNED="validation-artifacts/ALVISIA_PRO_5.5.2-hardened_release_unsigned.apk"
          BASE_SIGNED="$RUNNER_TEMP/ALVISIA_PRO_5.5.2-hardened_xop_input_signed.apk"
          printf '%s' "$ALVSIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alvsia-release.jks"
          test -s "$RUNNER_TEMP/alvsia-release.jks"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/alvsia-release.jks" \
            --ks-key-alias "$ALVSIA_KEY_ALIAS" \
            --ks-pass env:ALVSIA_KEYSTORE_PASSWORD \
            --key-pass env:ALVSIA_KEY_PASSWORD \
            --out "$BASE_SIGNED" "$BASE_UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$BASE_SIGNED"
          echo "PASS: internal XopProtector input is signed and v2/v3-verifiable."

      - name: Build XopProtector candidate for ReArk handoff
        run: |
          set -euo pipefail
          BASE_APK="$RUNNER_TEMP/ALVISIA_PRO_5.5.2-hardened_xop_input_signed.apk"
          test -s "$BASE_APK"
          XOP_DIR="$RUNNER_TEMP/xopprotector-src"
          rm -rf "$XOP_DIR"
          git clone --filter=blob:none https://github.com/xopJack/XopProtector.git "$XOP_DIR"
          git -C "$XOP_DIR" checkout --detach 5990c31
          # Prevent an upstream/local.properties Windows SDK path from overriding the hosted runner SDK.
          rm -f "$XOP_DIR/local.properties"
          test -d "$ANDROID_HOME/build-tools" || { echo "ERROR: Android build-tools missing from hosted SDK"; exit 1; }
          # XopProtector's native module otherwise requests legacy NDK 25.1.8937393.
          # Pin it to the NDK already installed above, avoiding a second SDK download.
          python3 - "$XOP_DIR/native/build.gradle.kts" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text().splitlines()
          if any(line.strip().startswith("ndkVersion") for line in lines):
              raise SystemExit("ERROR: upstream native module already pins NDK; review required")
          indexes = [i for i, line in enumerate(lines) if line.strip() == "android {"]
          if len(indexes) != 1:
              raise SystemExit("ERROR: unexpected Xop native Gradle layout; refusing blind NDK patch")
          lines.insert(indexes[0] + 1, '    ndkVersion = "27.0.12077973"')
          p.write_text("\n".join(lines) + "\n")
          check = p.read_text()
          if 'ndkVersion = "27.0.12077973"' not in check:
              raise SystemExit("ERROR: Xop native NDK pin was not applied")
          print("PASS: Xop native module pinned to NDK 27.0.12077973")
          PY
          # Disable optional machine-specific UniMP SDK lookup in upstream settings.
          python3 - "$XOP_DIR/settings.gradle.kts" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          start = s.find("val unimpLibsProp =")
          if start < 0:
              raise SystemExit("ERROR: expected unimpLibsProp block not found; refusing unknown upstream layout")
          # This block is the final section of settings.gradle.kts at the pinned upstream commit.
          # Drop the entire optional UniMP host section, including its machine-specific warning text.
          s = s[:start] + '// Optional UniMP host omitted in CI: the packer does not require its local SDK AARs.\n'
          p.write_text(s)
          check = p.read_text()
          if "unimpLibsProp" in check or "unimp.sdk.libs" in check or "E:/Android/" in check:
              raise SystemExit("ERROR: machine-specific SDK lookup remains")
          print("PASS: optional machine-specific UniMP SDK lookup removed")
          PY
          chmod +x "$XOP_DIR/gradlew"
          (cd "$XOP_DIR" && ./gradlew --no-daemon :packer:jar exportShellFiles)
          PACKER_JAR="$(find "$XOP_DIR/packer/build/libs" -maxdepth 1 -type f -name 'protector-packer-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$PACKER_JAR" && test -s "$PACKER_JAR"
          test -d "$XOP_DIR/executable/shell-files"
          CANDIDATE="$RUNNER_TEMP/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk"
          java -jar "$PACKER_JAR" "$BASE_APK" \
            -o "$CANDIDATE" \
            --shell-dir "$XOP_DIR/executable/shell-files" \
            --profile industry \
            --protect-so
          test -s "$CANDIDATE"
          # These standalone CLI executables must remain byte-identical and executable;
          # XopProtector may rewrite ordinary .so payloads, so restore only these
          # two audited open-source engines and their license notices from baseline.
          python3 - "$BASE_APK" "$CANDIDATE" <<'PY'
          import os, sys, zipfile
          base, candidate = sys.argv[1:3]
          native = {
              "lib/arm64-v8a/libunluac-cli.so": 0o100755,
              "lib/arm64-v8a/libluau-decompiler-cli.so": 0o100755,
          }
          notices = {
              "assets/engine_licenses/unluac-rs-MIT.txt": 0o100644,
              "assets/engine_licenses/luau-decompiler-MIT.txt": 0o100644,
              "assets/engine_licenses/unluac-rs-android-arm64.manifest": 0o100644,
              "assets/engine_licenses/unluac-rs-android-arm64.sha256": 0o100644,
              "assets/engine_licenses/luau-decompiler-android-arm64.manifest": 0o100644,
              "assets/engine_licenses/luau-decompiler-android-arm64.sha256": 0o100644,
          }
          replacements = {**native, **notices}
          temp = candidate + ".restored"
          with zipfile.ZipFile(base, "r") as src, zipfile.ZipFile(candidate, "r") as packed:
              base_names = set(src.namelist())
              missing = sorted(set(replacements) - base_names)
              if missing:
                  raise SystemExit(f"Baseline missing native engine entries: {missing}")
              with zipfile.ZipFile(temp, "w") as out:
                  for info in packed.infolist():
                      if info.filename in replacements:
                          continue
                      out.writestr(info, packed.read(info.filename))
                  for name, mode in replacements.items():
                      info = src.getinfo(name)
                      info.external_attr = mode << 16
                      if name in native:
                          info.compress_type = zipfile.ZIP_STORED
                      out.writestr(info, src.read(name))
          os.replace(temp, candidate)
          with zipfile.ZipFile(candidate, "r") as check:
              for name in native:
                  if check.read(name) != zipfile.ZipFile(base, "r").read(name):
                      raise SystemExit(f"Native engine changed during Xop restore: {name}")
          print("PASS: native Smart Lua executables and notices restored byte-identically")
          PY
          python3 - "$BASE_APK" "$CANDIDATE" <<'PY'
          import sys, zipfile
          base, candidate = sys.argv[1:3]
          base_required = {
              "lib/arm64-v8a/librasp_guard.so",
              "lib/arm64-v8a/libunluac-cli.so",
              "lib/arm64-v8a/libluau-decompiler-cli.so",
              "assets/engine_licenses/unluac-rs-MIT.txt",
              "assets/engine_licenses/luau-decompiler-MIT.txt",
              "assets/chaquopy/app.imy",
              "assets/nx/i.dat",
          }
          candidate_required = base_required | {"lib/arm64-v8a/libprotector.so", "assets/protector/dexes.zip"}
          with zipfile.ZipFile(base) as a, zipfile.ZipFile(candidate) as b:
              for label, z, required in (("baseline", a, base_required), ("Xop candidate", b, candidate_required)):
                  missing = sorted(required - set(z.namelist()))
                  if missing:
                      raise SystemExit(f"{label} missing required entries: {missing}")
                  if z.testzip() is not None:
                      raise SystemExit(f"{label} ZIP integrity check failed")
          print("PASS: ZIP integrity, Chaquopy payload, RASP library and Xop DEX container")
          PY
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BASE_BADGING="$("$AAPT" dump badging "$BASE_APK" | grep '^package:' | head -n 1)"
          CAND_BADGING="$("$AAPT" dump badging "$CANDIDATE" | grep '^package:' | head -n 1)"
          test -n "$BASE_BADGING" && test "$BASE_BADGING" = "$CAND_BADGING" || { echo "ERROR: package/version changed"; exit 1; }
          BASE_PERMS="$("$AAPT" dump permissions "$BASE_APK" | sort)"
          CAND_PERMS="$("$AAPT" dump permissions "$CANDIDATE" | sort)"
          test "$BASE_PERMS" = "$CAND_PERMS" || { echo "ERROR: manifest permission set changed"; diff -u <(printf '%s\n' "$BASE_PERMS") <(printf '%s\n' "$CAND_PERMS") || true; exit 1; }
          python3 tools/audit_release_apk.py "$CANDIDATE"
          cp release_security_audit.txt validation-artifacts/xop_candidate_security_audit.txt
          echo "PASS: XopProtector candidate passed structural and payload audits."

      - name: Sign the single XopProtector APK
        env:
          ALVSIA_KEYSTORE_BASE64: ${{ secrets.ALVSIA_KEYSTORE_BASE64 }}
          ALVSIA_KEYSTORE_PASSWORD: ${{ secrets.ALVSIA_KEYSTORE_PASSWORD }}
          ALVSIA_KEY_ALIAS: ${{ secrets.ALVSIA_KEY_ALIAS }}
          ALVSIA_KEY_PASSWORD: ${{ secrets.ALVSIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ALVSIA_KEYSTORE_BASE64 ALVSIA_KEYSTORE_PASSWORD ALVSIA_KEY_ALIAS ALVSIA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Actions secret $name is not configured; refusing to publish an unsigned APK."
              exit 1
            fi
          done
          BASE_APK="validation-artifacts/ALVISIA_PRO_5.5.2-hardened_release_unsigned.apk"
          CANDIDATE="$RUNNER_TEMP/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk"
          SIGNED="validation-artifacts/ALVISIA_PRO_5.5.2-xop_candidate_signed.apk"
          test -s "$BASE_APK"
          # Recreate candidate from the internal baseline in the preceding step's runner-temp path.
          # The packer output is preserved there by that step.
          test -s "$RUNNER_TEMP/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk" || {
            echo "ERROR: XopProtector output missing; refusing to sign a different APK."
            exit 1
          }
          printf '%s' "$ALVSIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alvsia-release.jks"
          test -s "$RUNNER_TEMP/alvsia-release.jks"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$ZIPALIGN" && test -x "$AAPT"
          # XopProtector rewrites a subset of lib/*.so with DEFLATE. When the
          # manifest declares extractNativeLibs="false" the package manager
          # rejects such a mixed-compression APK (INSTALL_FAILED_INVALID_APK,
          # shown on device as "paket tidak valid"). Store every native library
          # uncompressed and page-align it before signing.
          NORMALIZED="$RUNNER_TEMP/ALVISIA_PRO_5.5.2-xop_candidate_normalized.apk"
          ALIGNED="$RUNNER_TEMP/ALVISIA_PRO_5.5.2-xop_candidate_aligned.apk"
          python3 tools/normalize_apk_packaging.py \
            "$RUNNER_TEMP/ALVISIA_PRO_5.5.2-xop_candidate_unsigned.apk" "$NORMALIZED"
          "${ZIPALIGN}" -P 16 -f 4 "$NORMALIZED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/alvsia-release.jks" \
            --ks-key-alias "$ALVSIA_KEY_ALIAS" \
            --ks-pass env:ALVSIA_KEYSTORE_PASSWORD \
            --key-pass env:ALVSIA_KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          python3 tools/normalize_apk_packaging.py --check "$SIGNED"
          "${ZIPALIGN}" -c -P 16 -v 4 "$SIGNED"
          python3 -m unittest tests.test_signed_apk_validator
          python3 tools/validate_signed_apk.py "$SIGNED" "$APKSIGNER" "$ZIPALIGN" "$AAPT"
          python3 tools/audit_release_apk.py "$SIGNED"
          cp release_security_audit.txt validation-artifacts/xop_candidate_security_audit.txt
          sha256sum "$SIGNED"
          echo "PASS: one XopProtector APK signed and signature-verified. ReArk changes must be signed again afterward."

      - name: Report release APK fingerprint and size
        run: |
          set -euo pipefail
          APK=validation-artifacts/ALVISIA_PRO_5.5.2-hardened_release_unsigned.apk
          test -s "$APK"
          echo "Commit: $GITHUB_SHA"
          echo "APK bytes: $(wc -c < "$APK" | tr -d ' ')"
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"

      - name: Publish private draft validation release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alvsia-validation-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ALVISIA PRO validation build ${{ github.run_number }}
          draft: true
          prerelease: true
          # Publish one APK only: the XopProtector candidate for the ReArk handoff.
          # The baseline APK is an internal CI input and is not attached to the release.
          files: |
            validation-artifacts/ALVISIA_PRO_5.5.2-xop_candidate_signed.apk
            validation-artifacts/xop_candidate_security_audit.txt
          fail_on_unmatched_files: true

      # Keep a short-lived CI download path if repository release policy blocks draft releases.
      # One-day retention limits storage use while preserving the signed APK for validation.
      - name: Upload signed XopProtector validation APK
        if: always() && hashFiles('validation-artifacts/ALVISIA_PRO_5.5.2-xop_candidate_signed.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ALVISIA_PRO_5.5.2-xop_candidate_signed
          path: |
            validation-artifacts/ALVISIA_PRO_5.5.2-xop_candidate_signed.apk
            validation-artifacts/xop_candidate_security_audit.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Restore source files after sealed build
        if: always()
        run: python3 tools/seal_python.py --restore

      - name: Check no debug flags in manifest
        run: |
          if grep -q 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo "FAIL: debuggable=true in manifest"; exit 1
          fi
          echo "OK: manifest clean"

      - name: Verify CERT_SHA256 in build config
        run: grep -q "CERT_SHA256" app/build.gradle.kts || (echo "FAIL" && exit 1)

      - name: Verify branch restriction
        run: |
          BRANCH="${GITHUB_REF_NAME:-}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BRANCH" != "main" ]; then
            echo "WARNING: push from non-main branch: $BRANCH"
          fi
          echo "Branch: $BRANCH"

      - name: Send STEALTH Telegram build report
        if: always()
        timeout-minutes: 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          python3 - <<'PY'
          import html, json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              print("SKIP: Telegram secrets are not configured; build result remains unchanged.")
              raise SystemExit(0)
          status = os.environ.get("JOB_STATUS", "unknown").upper()
          icon = "🟢" if status == "SUCCESS" else "🔴" if status == "FAILURE" else "🟠"
          esc = lambda s: html.escape(s, quote=True)
          repo = os.environ.get("REPOSITORY", "unknown")
          ref = os.environ.get("REF_NAME", "unknown")
          sha = os.environ.get("COMMIT_SHA", "")[:12]
          workflow = os.environ.get("WORKFLOW_NAME", "Android validation")
          run_url = os.environ.get("RUN_URL", "")
          message = (
              "<b>⟦ ALVISIA PRO // STEALTH BUILD INTEL ⟧</b>\n"
              "━━━━━━━━━━━━━━━━━━\n"
              f"{icon} <b>STATUS:</b> <code>{esc(status)}</code>\n"
              f"🛰 <b>PIPELINE:</b> <code>{esc(workflow)}</code>\n"
              f"📦 <b>REPOSITORY:</b> <code>{esc(repo)}</code>\n"
              f"🌿 <b>BRANCH:</b> <code>{esc(ref)}</code>\n"
              f"🔏 <b>COMMIT:</b> <code>{esc(sha)}</code>\n"
              "━━━━━━━━━━━━━━━━━━\n"
              f'🔎 <a href="{esc(run_url)}">OPEN BUILD LOG</a>\n'
              "<i>ALVISIA // AUTOMATED CI REPORT</i>"
          )
          payload = json.dumps({
              "chat_id": chat,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if not data.get("ok"):
                  raise SystemExit("Telegram API rejected the build report")
              print("PASS: STEALTH Telegram build report delivered")
          except Exception as exc:
              print(f"WARNING: Telegram report delivery failed: {type(exc).__name__}: {exc}")
              # Notification failure must not mask the real build result.
          PY
