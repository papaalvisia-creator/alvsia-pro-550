name: Unluac-rs Android ARM64 Candidate
on:
  push:
    branches: [ feat/lua-intelligence-orchestrator-20261107 ]
    paths:
      - .github/workflows/unluac-rs-android-candidate.yml
      - tools/build_unluac_rs_android.sh
      - app/src/main/python/lua_engine/**
      - tests/test_lua*.py
  pull_request:
    branches: [ feat/full-reference-source-registry-20261106 ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unluac-rs-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-fixture-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install host Lua compilers and LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4 luajit binutils build-essential cmake
      - name: Build Lua 5.5 reference compiler
        run: |
          set -euo pipefail
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz | tar -xz
          make -C lua-5.5.0 linux -j2
          test -x lua-5.5.0/src/luac
          lua-5.5.0/src/luac -v
      - name: Build pinned Luau reference compiler
        run: |
          set -euo pipefail
          git init luau-src
          git -C luau-src remote add origin https://github.com/luau-lang/luau.git
          git -C luau-src fetch --depth 1 origin 91acc8decfca5281fab4a8db46c894268fc70aac
          git -C luau-src checkout --detach FETCH_HEAD
          test "$(git -C luau-src rev-parse HEAD)" = "91acc8decfca5281fab4a8db46c894268fc70aac"
          cmake -S luau-src -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=ON -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Compile.CLI --parallel 2
          test -x luau-build/luau-compile
          luau-build/luau-compile --help
      - name: Install Rust stable and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install pinned Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
      - name: Fetch pinned upstream candidate
        run: |
          git clone --depth 1 --branch v1.4.4 https://github.com/x3zvawq/unluac-rs.git candidate
          test "$(grep -m1 '^version = ' candidate/Cargo.toml | cut -d '"' -f2)" = "1.4.4"
          grep -q '^license = "MIT"' candidate/Cargo.toml
          test -s candidate/LICENSE.txt
      - name: Build host CLI
        working-directory: candidate
        run: cargo build --locked --release -p unluac-cli
      - name: Verify Lua 5.1–5.5, LuaJIT 2.1 and Luau fixtures
        working-directory: candidate
        run: |
          set -euo pipefail
          CLI="$PWD/target/release/unluac-cli"
          mkdir -p "$RUNNER_TEMP/lua-fixtures"
          cat > "$RUNNER_TEMP/lua-fixtures/sample.lua" <<'LUA'
          local function combine(a, b)
              local value = a + b
              if value > 10 then
                  return value * 2
              end
              return value
          end
          return combine(7, 9)
          LUA
          for version in 5.1 5.2 5.3 5.4; do
            COMPILER="luac$version"
            "$COMPILER" -o "$RUNNER_TEMP/lua-fixtures/input-$version.luac" "$RUNNER_TEMP/lua-fixtures/sample.lua"
            "$CLI" -i "$RUNNER_TEMP/lua-fixtures/input-$version.luac" -o "$RUNNER_TEMP/lua-fixtures/output-$version.lua" --generate-mode strict
            "$COMPILER" -p "$RUNNER_TEMP/lua-fixtures/output-$version.lua"
            test -s "$RUNNER_TEMP/lua-fixtures/output-$version.lua"
            echo "PASS Lua $version parse/decompile/re-parse"
          done
          luajit -b "$RUNNER_TEMP/lua-fixtures/sample.lua" "$RUNNER_TEMP/lua-fixtures/input-luajit.lj"
          "$CLI" -i "$RUNNER_TEMP/lua-fixtures/input-luajit.lj" -o "$RUNNER_TEMP/lua-fixtures/output-luajit.lua" --generate-mode strict
          luajit -b "$RUNNER_TEMP/lua-fixtures/output-luajit.lua" "$RUNNER_TEMP/lua-fixtures/output-luajit.lj"
          test -s "$RUNNER_TEMP/lua-fixtures/output-luajit.lua"
          echo "PASS LuaJIT parse/decompile/re-compile"
          LUA55="$GITHUB_WORKSPACE/lua-5.5.0/src/luac"
          "$LUA55" -o "$RUNNER_TEMP/lua-fixtures/input-5.5.luac" "$RUNNER_TEMP/lua-fixtures/sample.lua"
          "$CLI" -i "$RUNNER_TEMP/lua-fixtures/input-5.5.luac" -o "$RUNNER_TEMP/lua-fixtures/output-5.5.lua" --generate-mode strict
          "$LUA55" -p "$RUNNER_TEMP/lua-fixtures/output-5.5.lua"
          test -s "$RUNNER_TEMP/lua-fixtures/output-5.5.lua"
          echo "PASS Lua 5.5 parse/decompile/re-parse"
          cat > "$RUNNER_TEMP/lua-fixtures/sample.luau" <<'LUAU'
          local function combine(a: number, b: number): number
              local value = a + b
              if value > 10 then
                  return value * 2
              end
              return value
          end
          return combine(7, 9)
          LUAU
          "$GITHUB_WORKSPACE/luau-build/luau-compile" --binary "$RUNNER_TEMP/lua-fixtures/sample.luau" > "$RUNNER_TEMP/lua-fixtures/input-luau.luau"
          "$CLI" -i "$RUNNER_TEMP/lua-fixtures/input-luau.luau" -o "$RUNNER_TEMP/lua-fixtures/output-luau.lua" --generate-mode strict
          "$GITHUB_WORKSPACE/luau-build/luau-compile" --binary "$RUNNER_TEMP/lua-fixtures/output-luau.lua" > "$RUNNER_TEMP/lua-fixtures/output-luau.bc"
          test -s "$RUNNER_TEMP/lua-fixtures/output-luau.bc"
          echo "PASS Luau parse/decompile/re-compile"
      - name: Build and stage Android ARM64 app candidate
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: |
          set -euo pipefail
          bash tools/build_unluac_rs_android.sh
          test -s app/src/main/jniLibs/arm64-v8a/libunluac-cli.so
          test -s app/src/main/assets/engine_licenses/unluac-rs-MIT.txt
          cat app/src/main/assets/engine_licenses/unluac-rs-android-arm64.sha256
          cat app/src/main/assets/engine_licenses/unluac-rs-android-arm64.manifest
      - name: Upload Android ARM64 candidate and provenance
        uses: actions/upload-artifact@v4
        with:
          name: unluac-rs-v1.4.4-android-arm64-candidate
          path: |
            app/src/main/jniLibs/arm64-v8a/libunluac-cli.so
            app/src/main/assets/engine_licenses/unluac-rs-MIT.txt
            app/src/main/assets/engine_licenses/unluac-rs-android-arm64.sha256
            app/src/main/assets/engine_licenses/unluac-rs-android-arm64.manifest
          if-no-files-found: error
