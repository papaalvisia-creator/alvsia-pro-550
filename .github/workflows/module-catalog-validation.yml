name: Module catalog consistency

on:
  push:
    branches: [main, feat/alvsia-smart-premium-v1-20261112, fix/engine-repair-20261114, feat/alvsia-capability-expansion-security-20261114-clean]
    paths:
      - "tests/test_module_catalog_consistency.py"
      - "app/src/main/java/com/alvsia/pro/tool/ToolCatalog.kt"
      - "app/src/main/java/com/alvsia/pro/tool/SubMenus.kt"
      - "app/src/main/java/com/alvsia/pro/ui/home/HomeScreen.kt"
      - "app/src/main/java/com/alvsia/pro/ui/profile/ProfileScreen.kt"
      - ".github/workflows/module-catalog-validation.yml"
  pull_request:
    branches: [main, feat/alvsia-smart-premium-v1-20261112, fix/engine-repair-20261114, feat/alvsia-capability-expansion-security-20261114-clean]
    paths:
      - "tests/test_module_catalog_consistency.py"
      - "app/src/main/java/com/alvsia/pro/tool/ToolCatalog.kt"
      - "app/src/main/java/com/alvsia/pro/tool/SubMenus.kt"
      - "app/src/main/java/com/alvsia/pro/ui/home/HomeScreen.kt"
      - "app/src/main/java/com/alvsia/pro/ui/profile/ProfileScreen.kt"
      - ".github/workflows/module-catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate 7x22 Smart catalog consistency
        run: python3 tests/test_module_catalog_consistency.py
