name: ALVSIA release safety audit

on:
  push:
    branches: [main, release/5.5.2-19-module-redesign, fix/engine-repair-20261114, feat/alvsia-capability-expansion-security-20261114-clean]
  pull_request:
    branches: [main, feat/alvsia-smart-premium-v1-20261112, fix/engine-repair-20261114, feat/alvsia-capability-expansion-security-20261114-clean]

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Chaquopy host-side pip imports cgi; Python 3.13+ removes it.
      - name: Set up compatible host Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 19-module catalog and security baseline
        run: python3 scripts/release_safety_audit.py
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle lint
        run: ./gradlew :app:lintRelease --no-daemon
