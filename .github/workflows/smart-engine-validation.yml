name: Smart Engine Validation

on:
  push:
    branches:
      - "feat/**"
  pull_request:

jobs:
  smart-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Smart Lua orchestration
        run: python tests/smart/test_smart_lua_engine.py
